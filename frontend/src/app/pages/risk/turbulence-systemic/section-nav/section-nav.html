<nav aria-label="Page sections" class="surface-card flex flex-wrap items-center gap-x-1 gap-y-1 px-4 py-2">
  <span class="px-2 text-xs text-text-secondary">Jump to</span>

  @for (section of sections; track section) {
    <a
      [attr.data-testid]="'jump-' + section"
      class="inline-flex min-h-11 items-center rounded-md px-2 text-sm text-text-secondary transition-colors hover:bg-surface-inset hover:text-text aria-[current=true]:bg-surface-inset aria-[current=true]:font-medium aria-[current=true]:text-text"
      [href]="'#' + anchor[section]"
      [attr.aria-current]="current() === section ? 'true' : null"
      (click)="onJump(section, $event)"
    >
      {{ label[section] }}
    </a>
  }
</nav>
