@if (failure(); as error) {
  <!--
    One panel's computation, and only this one. The message names the fault —
    a singular Σ and a missing price series are different problems with
    different answers — and the retry re-runs this panel alone.
  -->
  <div [attr.data-testid]="'panel-error-' + panel()">
    <app-error-state
      [message]="error.message"
      [detail]="error.detail"
      cause="load"
      (retry)="retry()"
    />
  </div>
} @else {
  <!--
    A placeholder at the height of the figure it stands in for, so nothing on
    the page jumps when the computation lands. The shimmer is suppressed under
    prefers-reduced-motion by the global rule in styles.css.
  -->
  <div
    [attr.data-testid]="'panel-loading-' + panel()"
    aria-busy="true"
    class="surface-card flex flex-col gap-3 p-4"
  >
    <p [attr.role]="announce() ? 'status' : null" class="sr-only">Computing {{ label() }}…</p>
    <app-skeleton-block height="h-5" width="w-1/3" />
    <app-skeleton-block [height]="height()" />
  </div>
}
