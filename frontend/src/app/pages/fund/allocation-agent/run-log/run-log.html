<div class="flex flex-col gap-2">
  <button
    type="button"
    class="flex min-h-11 items-center gap-2 self-start rounded-md px-2 text-sm font-medium text-text transition-colors hover:bg-surface-inset"
    [attr.aria-expanded]="expanded()"
    aria-controls="run-log-entries"
    (click)="expanded.set(!expanded())"
  >
    <span aria-hidden="true" class="text-xs text-text-secondary">{{ expanded() ? '▾' : '▸' }}</span>
    {{ expanded() ? 'Collapse' : 'Expand' }} run log
    <span class="text-xs font-normal text-text-secondary">
      {{ entries().length }} {{ entries().length === 1 ? 'step' : 'steps' }}
      @if (status() === 'running') {
        · running
      }
    </span>
  </button>

  @if (expanded()) {
    <!-- Polite: steps land during a run, and none of them should interrupt. -->
    <ol
      id="run-log-entries"
      aria-live="polite"
      class="flex flex-col gap-1 rounded-md bg-surface-inset px-4 py-3 text-sm"
    >
      @for (entry of entries(); track $index) {
        <li class="flex gap-3">
          <span class="shrink-0 font-mono tabular-nums text-text-secondary">{{ entry.at }}</span>
          <span class="text-text">{{ entry.message }}</span>
        </li>
      }
    </ol>
  }
</div>
