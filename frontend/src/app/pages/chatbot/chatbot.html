<div class="flex flex-col h-full">
  <!-- Messages area -->
  <!-- overscroll-contain: prevents the page/shell from scrolling when the message list
       reaches its boundary (rubber-band escape on iOS Safari and over-scroll on Chrome). -->
  <div class="flex-1 overflow-y-auto overscroll-contain px-4 py-6 md:px-8" #scrollContainer role="log" aria-label="Chat messages" aria-live="polite">
    @if (messages().length === 0) {
      <div class="flex items-center justify-center h-full">
        <div class="text-center max-w-sm">
          <div class="w-12 h-12 mx-auto mb-4 rounded-2xl bg-accent/10 flex items-center justify-center">
            <lucide-icon name="message-circle-more" class="w-6 h-6 text-accent" aria-hidden="true" />
          </div>
          <h2 class="text-base font-semibold text-text mb-1">Start a conversation</h2>
          <p class="text-sm text-text-secondary">Ask anything to get started.</p>
        </div>
      </div>
    } @else {
      <div class="max-w-3xl mx-auto space-y-4">
        @for (msg of messages(); track msg.id) {
          @if (msg.role === 'user') {
            <div class="flex justify-end">
              <div class="max-w-[80%] rounded-2xl rounded-br-md px-4 py-2.5 bg-accent text-white text-sm leading-relaxed whitespace-pre-wrap">
                {{ msg.content }}
              </div>
            </div>
          } @else if (msg.isError) {
            <div class="flex justify-start">
              <div class="max-w-[80%] rounded-2xl rounded-bl-md px-4 py-2.5 bg-red-50 border border-red-200 text-red-800 text-sm leading-relaxed">
                <div class="flex items-center gap-2">
                  <lucide-icon name="circle-alert" class="w-4 h-4 flex-shrink-0 text-red-500" aria-hidden="true" />
                  <span>{{ msg.content }}</span>
                </div>
              </div>
            </div>
          } @else {
            <div class="flex justify-start">
              <div class="max-w-[80%] rounded-2xl rounded-bl-md px-4 py-2.5 bg-zinc-100 text-text text-sm leading-relaxed whitespace-pre-wrap">
                {{ msg.content }}
              </div>
            </div>
          }
        }

        @if (isLoading()) {
          <div class="flex justify-start" role="status" aria-label="Assistant is typing">
            <div class="rounded-2xl rounded-bl-md px-4 py-2.5 bg-zinc-100">
              <div class="flex items-center gap-1.5" aria-hidden="true">
                <div class="w-1.5 h-1.5 rounded-full bg-text-secondary/50 animate-bounce motion-reduce:animate-none [animation-delay:0ms]"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-text-secondary/50 animate-bounce motion-reduce:animate-none [animation-delay:150ms]"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-text-secondary/50 animate-bounce motion-reduce:animate-none [animation-delay:300ms]"></div>
              </div>
            </div>
          </div>
        }
      </div>
    }
  </div>

  <!-- Input bar — Gemini-style pill, identical on mobile and desktop.
       The textarea and send button sit inline (items-end), so the send stays
       pinned bottom-right as the text grows. The textarea auto-grows up to a
       ~168px cap (matching Gemini's 7-line max), then scrolls internally. -->
  <div class="px-4 py-3 md:px-8 md:py-4">
    <form
      (ngSubmit)="onSend()"
      class="max-w-3xl mx-auto flex items-end gap-2 rounded-[26px] border border-border bg-surface-inset px-2 py-1.5 shadow-sm transition-colors focus-within:border-accent/40 focus-within:shadow">
      <textarea
        aria-label="Chat message"
        class="flex-1 resize-none border-0 bg-transparent px-3 py-1.5 text-[15px]/6 text-text placeholder:text-text-secondary/60
               [scrollbar-width:none] [&::-webkit-scrollbar]:hidden
               focus:outline-none focus:ring-0"
        rows="1"
        placeholder="Type a message..."
        [value]="userInput()"
        (input)="onInputChange($event)"
        (keydown.enter)="onKeydown($event)"
        [disabled]="isLoading()"
        #inputEl></textarea>
      <button
        type="submit"
        aria-label="Send message"
        [disabled]="isLoading() || !userInput().trim()"
        class="flex-shrink-0 flex items-center justify-center w-9 h-9 rounded-full bg-accent hover:bg-accent/90 disabled:opacity-40 disabled:cursor-not-allowed text-white transition-colors">
        <lucide-icon name="arrow-up" class="w-5 h-5" aria-hidden="true" />
      </button>
    </form>
  </div>
</div>
