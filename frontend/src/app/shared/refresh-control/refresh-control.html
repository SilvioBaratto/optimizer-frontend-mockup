<!--
  Ghost, not outlined. Refresh is a tertiary action sitting beside the state it
  re-reads, and a boxed control there adds an outline to every card that can
  reload itself. The accent-coloured label carries the affordance instead.
-->
<button
  type="button"
  appButton="ghost"
  class="gap-1.5"
  [disabled]="busy()"
  [attr.aria-busy]="busy() || null"
  (click)="refresh.emit()"
>
  <span aria-hidden="true">&#8635;</span>
  {{ label() }}
</button>
