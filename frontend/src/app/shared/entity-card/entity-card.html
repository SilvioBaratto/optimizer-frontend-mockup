<!--
  One interactive element per card, never nested links: anchor, button, or a
  plain container when the card is not actionable.
-->
@if (route(); as target) {
  <a [routerLink]="target" [class]="classes()" [attr.aria-current]="current() ? 'page' : null">
    <ng-container [ngTemplateOutlet]="body" />
  </a>
} @else if (selectable()) {
  <button
    type="button"
    [class]="classes()"
    [attr.aria-current]="current() ? 'true' : null"
    (click)="selected.emit()"
  >
    <ng-container [ngTemplateOutlet]="body" />
  </button>
} @else {
  <div [class]="classes()">
    <ng-container [ngTemplateOutlet]="body" />
  </div>
}

<ng-template #body>
  <span class="flex min-w-0 flex-col gap-0.5">
    <span class="truncate text-sm font-medium text-text">{{ title() }}</span>
    @if (meta()) {
      <span class="truncate text-xs text-text-secondary">{{ meta() }}</span>
    }
  </span>
  <!--
    `flex-wrap` and `max-w-full` are here as a guard rail, not for decoration.
    `shrink-0` sizes this slot at its content's max-content width and refuses to
    give way, so a caller that projects several badges and actions produced a
    slot wider than the viewport and the page scrolled sideways — measured at
    163px on doc 17 before it moved those actions into an ActionButtonRow
    beneath the card, which is what its spec asked for anyway. Wrapping costs
    nothing for the single-line content every other caller passes, and turns
    that failure into an extra line instead of horizontal page scroll.
  -->
  <span class="flex max-w-full shrink-0 flex-wrap items-center justify-end gap-2">
    <ng-content />
  </span>
</ng-template>
