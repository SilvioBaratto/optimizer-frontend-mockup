<section class="rounded-lg border border-border bg-surface-raised">
  <header
    class="flex flex-col gap-2 border-b border-border px-4 py-3 sm:flex-row sm:items-center sm:justify-between"
  >
    <div class="flex flex-col gap-0.5">
      @if (eyebrow()) {
        <p class="text-xs font-semibold uppercase tracking-wider text-text-secondary">
          {{ eyebrow() }}
        </p>
      }
      <h2 class="text-xl font-semibold text-text">{{ title() }}</h2>
    </div>
    <div class="flex shrink-0 items-center gap-2">
      <ng-content select="[hero-action]" />
    </div>
  </header>
  <div class="px-4 py-3">
    <ng-content />
  </div>
  <ng-content select="[hero-footer]" />
</section>
