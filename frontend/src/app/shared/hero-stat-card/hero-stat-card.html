<section class="surface-card">
  <header
    class="flex flex-col gap-2 border-b border-border px-4 py-3 sm:flex-row sm:items-center sm:justify-between"
  >
    <div class="flex flex-col gap-0.5">
      @if (eyebrow()) {
        <p class="eyebrow">
          {{ eyebrow() }}
        </p>
      }
      <h2 class="text-xl font-semibold text-text">{{ title() }}</h2>
    </div>
    <div class="flex shrink-0 items-center gap-2">
      <ng-content select="[hero-action]" />
    </div>
  </header>
  <div class="px-4 py-3">
    <ng-content />
  </div>
  <ng-content select="[hero-footer]" />
</section>
