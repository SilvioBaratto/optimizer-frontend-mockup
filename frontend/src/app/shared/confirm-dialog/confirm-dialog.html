<!--
  `m-auto` restores what the UA stylesheet already does for a modal dialog: it
  centres one with `margin: auto`. Tailwind's preflight zeroes the margin on
  every element, which otherwise pins the dialog to the top-left corner.
-->
<dialog
  #dialog
  class="m-auto max-w-md rounded-lg border border-border bg-surface-raised p-0 text-text backdrop:bg-text/30"
  (close)="cancelled.emit()"
  (cancel)="cancelled.emit()"
>
  <div class="flex flex-col gap-3 p-5">
    <h2 class="text-lg font-semibold text-text">{{ title() }}</h2>
    @if (message()) {
      <p class="text-sm text-text-secondary">{{ message() }}</p>
    }
    <div class="mt-2 flex justify-end gap-2">
      <button
        type="button"
        class="inline-flex min-h-11 items-center rounded-md border border-border-control px-3 text-sm font-medium text-text transition-colors hover:bg-surface-inset"
        (click)="cancelled.emit()"
      >
        Cancel
      </button>
      <button
        type="button"
        [class]="
          destructive()
            ? 'inline-flex min-h-11 items-center rounded-md bg-danger px-4 text-sm font-medium text-white transition-opacity hover:opacity-90'
            : 'inline-flex min-h-11 items-center rounded-md bg-primary px-4 text-sm font-medium text-on-primary transition-colors hover:bg-primary-hover'
        "
        (click)="confirmed.emit()"
      >
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</dialog>
